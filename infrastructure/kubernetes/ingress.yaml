apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopilot
  namespace: shopilot
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - shopilot.example.com
    secretName: shopilot-tls
  rules:
  - host: shopilot.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
