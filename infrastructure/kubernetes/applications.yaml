apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shopilot
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: backend
  template:
    metadata:
      labels: *id001
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: backend
        image: ghcr.io/REPLACE_OWNER/shopilot-backend:REPLACE_TAG
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
        envFrom:
        - configMapRef:
            name: shopilot-config
        - secretRef:
            name: shopilot-secrets
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shopilot
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopilot
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: frontend
  template:
    metadata:
      labels: *id001
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: frontend
        image: ghcr.io/REPLACE_OWNER/shopilot-frontend:REPLACE_TAG
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - NET_RAW
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shopilot
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
