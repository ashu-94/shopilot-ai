name: ShopPilot verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check backend mcp_servers tests
      - run: uv run mypy backend
      - run: uv run pytest -q
      - run: uv run python -m scripts.evaluate
      - run: uv run python -m scripts.evaluate_retrieval
      - run: uv run --with pip-audit pip-audit --skip-editable
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: shopilot_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/shopilot_test
      TEST_CHECKPOINT_URL: postgresql://test:test@localhost:5432/shopilot_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.12
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: verification/}
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -f infrastructure/docker/backend.Dockerfile -t shopilot-backend:ci .
      - run: docker build -f infrastructure/docker/frontend.Dockerfile -t shopilot-frontend:ci .
      - run: docker compose up -d --build
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail http://localhost:8000/health/ready; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Verify all stores, MCP, checkout, Kafka consumers and monitoring
        run: docker compose exec -T backend python -m scripts.verify_stack
      - name: Verify saved approval across restart
        run: |
          docker compose exec -T backend python -m scripts.verify_stack --phase prepare-restart
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T backend python -m scripts.verify_stack --phase resume
      - name: Verify broker outage recovery
        run: |
          docker compose stop kafka
          docker compose exec -T backend python -m scripts.verify_stack --phase kafka-outage
          docker compose start kafka
          docker compose exec -T backend python -m scripts.verify_stack --phase kafka-recovery
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p verification
          docker compose cp backend:/app/data/verification/. ./verification/ || true
          docker compose logs --no-color --tail 200 > verification/docker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: docker-evidence, path: verification/}
      - if: always()
        run: docker compose down -v
  # Add a protected-environment deployment job for your registry/cluster.
  # No cloud credentials or automatic production deployment are embedded.
