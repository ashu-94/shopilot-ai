name: Feature proposal
description: Propose a focused improvement and its acceptance criteria.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and trade-offs
      description: Include security, compatibility or operating costs when relevant.
    validations:
      required: true
